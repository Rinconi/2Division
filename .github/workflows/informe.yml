name: Informe Liga Hipermotion
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar
        run: pip install -r requirements.txt
      - name: Generar informe
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python main2division.py
      - name: Guardar
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add informes/ logos/
          git commit -m "Nuevo informe" || echo "sin cambios"
          git push
