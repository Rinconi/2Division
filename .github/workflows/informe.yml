name: Informe Liga Hipermotion
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar
        run: pip install reportlab pillow requests
      - name: Generar informe
        run: |
          python main2division.py
          ls -lh
          ls -lh logos/ || echo "no hay carpeta logos"
      - name: Guardar
        uses: actions/upload-artifact@v4
        with:
          name: Informe-Segunda
          path: |
            *.pdf
            Segunda*.pdf
