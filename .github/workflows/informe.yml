name: Informe Liga Hipermotion
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar
        run: pip install reportlab pillow
      - name: Generar informe
        run: python main2division.py
      - name: Guardar PDF
        uses: actions/upload-artifact@v4
        with:
          name: Informe-Segunda-2Division
          path: "*.pdf"
          if-no-files-found: error
