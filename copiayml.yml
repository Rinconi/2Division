name: Informe Liga Hipermotion

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar
        run: pip install reportlab requests
      - name: Generar informe
        run: python main2division.py
      - name: Guardar PDF
        #uses: actions/upload-artifact@v4
        #with:
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add informes/
          git commit -m "Actualiza informe de Segunda" || echo "sin cambios"
          git push
          
          
